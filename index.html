<!doctype html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="X-Content-Type-Options" content="nosniff" />
	<!-- CSP via meta. La copia HTTP en /public/.htaccess es la fuente de verdad
	     en producción. Aquí mantenemos una versión equivalente para dev (vite)
	     y como segunda red de seguridad. NO incluimos `frame-ancestors` ni
	     `X-Frame-Options` porque ambos son ignorados en <meta> y deben llegar
	     siempre por cabecera HTTP (ya están en .htaccess). connect-src incluye
	     región-hosts de Google Analytics (region1.google-analytics.com, etc). -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com https://*.supabase.co https://www.youtube-nocookie.com https://www.youtube.com" />
	<meta name="referrer" content="strict-origin-when-cross-origin" />

	<!-- Favicon (se sirve desde /images/ en producción) -->
	<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png" />
	<link rel="shortcut icon" href="/images/favicon.png" />
	<link rel="apple-touch-icon" href="/images/favicon.png" />
	<link rel="manifest" href="/manifest.webmanifest" />

	<!-- Primary Meta — SOLO lo que es cierto para TODAS las rutas.
	     Nada de canonical, description ni og:url/title/description aquí: este
	     head es la plantilla de toda la SPA, así que un valor de la portada se
	     servía tal cual en /catalogo y en cada /curso/*, diciéndole a Google
	     que eran duplicados de la home (y duplicando el canonical en los posts,
	     donde react-helmet-async añade el suyo sin borrar el estático: con dos
	     canonical en conflicto, Google ignora ambos).
	     Cada página fija los suyos con useSEO (src/hooks/useSEO.js, que
	     actualiza el tag existente o lo crea) o con <Helmet>. El <title> se
	     queda solo como fallback antes de que React monte; toda ruta pública
	     lo pisa con el propio. -->
	<title>Apps educativas interactivas para primaria y secundaria</title>
	<meta name="keywords"
		content="apps educativas, juegos educativos, primaria, ESO, bachillerato, recursos docentes, lengua, matemáticas, ciencias, pasapalabra, ahorcado, quiz battle, duelo 1 vs 1, gratis, sin registro" />
	<meta name="author" content="Edu Torregrosa" />
	<meta name="generator" content="Apps Educativas" />
	<meta name="theme-color" content="#6d28d9" />
	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

	<!-- Open Graph — solo los invariantes del sitio. og:url/title/description
	     los pone cada página. -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Apps Educativas" />
	<meta property="og:locale" content="es_ES" />
	<meta property="og:image" content="https://apps-educativas.com/images/logo.webp" />
	<meta property="og:image:alt" content="Apps Educativas — plataforma de juegos educativos" />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="https://apps-educativas.com/images/logo.webp" />

	<!-- Google Analytics 4 con Consent Mode v2 (RGPD / LSSI-CE).
	     Por defecto todo el consentimiento está denegado; el banner de cookies
	     lo actualiza a 'granted' si el usuario acepta. GA sigue recibiendo pings
	     cookieless mientras tanto para métricas agregadas. -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-VYHZSG7RRZ"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('consent', 'default', {
			ad_storage: 'denied',
			ad_user_data: 'denied',
			ad_personalization: 'denied',
			analytics_storage: 'denied',
			functionality_storage: 'granted',
			security_storage: 'granted',
			wait_for_update: 500
		});
		// Si el usuario ya había aceptado en una visita previa, lo aplicamos ya.
		try {
			var prev = localStorage.getItem('cookie-consent');
			if (prev === 'accepted') {
				gtag('consent', 'update', {
					analytics_storage: 'granted',
					ad_storage: 'granted',
					ad_user_data: 'granted',
					ad_personalization: 'granted'
				});
			}
		} catch (e) {}
		gtag('js', new Date());
		gtag('config', 'G-VYHZSG7RRZ', { anonymize_ip: true, send_page_view: false });
	</script>

	<!-- Aquí vivía un <noscript> con un resumen de la PORTADA, pensado para los
	     crawlers que no ejecutan JS. Lo sustituye tools/prerender.mjs, que
	     vuelca en dist/ el HTML real de cada ruta pública: el bot recibe el
	     contenido de LA PÁGINA que ha pedido, no el de la home. Mantenerlo
